<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Position">
		<sdpi-select setting="pos" default="D">
			<option value="D">D (marche avant)</option>
			<option value="N">N (neutre)</option>
			<option value="R">R (marche arrière)</option>
		</sdpi-select>
	</sdpi-item>
	<p style="color:#9aa0a6;font-size:9pt;margin:8px 16px">Une touche par position. Sur certains bus (Heuliez…), il faut appuyer sur le frein pour passer D ou R.</p>
	<p style="color:#9aa0a6;font-size:9pt;margin:12px 16px">Il faut le plugin <b>streamdeck.lua</b> dans le dossier <b>plugins</b> d'openOMSI.</p>
</body>
</html>
