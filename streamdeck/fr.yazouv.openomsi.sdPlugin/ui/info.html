<!doctype html>
<html lang="fr">
<head>
	<meta charset="utf-8" />
	<script src="sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Afficher">
		<sdpi-select setting="field" default="speed">
			<option value="speed">Vitesse</option>
			<option value="limit">Limitation de vitesse</option>
			<option value="delay">Retard / avance</option>
			<option value="next_stop">Prochain arrêt</option>
			<option value="clock">Heure du jeu</option>
			<option value="line">Ligne / service</option>
			<option value="passengers">Passagers</option>
			<option value="gear">Rapport engagé</option>
			<option value="fuel">Carburant</option>
			<option value="stop_request">Demande d'arrêt</option>
		</sdpi-select>
	</sdpi-item>
	<p style="color:#9aa0a6;font-size:9pt;margin:12px 16px">Il faut le plugin <b>streamdeck.lua</b> dans le dossier <b>plugins</b> d'openOMSI.</p>
</body>
</html>
